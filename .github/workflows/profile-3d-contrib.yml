name: Calendário 3D de contribuições

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, 03:17 no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.8.0
        env:
          # Opcional: crie o secret PROFILE_TOKEN (token pessoal com leitura de repositórios)
          # para incluir as linguagens dos repositórios privados. Sem ele, usa o token padrão.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: atualiza calendário 3D"
          git push
